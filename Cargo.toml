[package]
name = "code-sandbox"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web / async
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Serialization
# Pinned: swc_common re-exports `serde::__private`, removed in serde >= 1.0.220.
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "1"

# WASM runtime
wasmtime = "27"
wasmtime-wasi = "27"

# Utilities
anyhow = "1"
tempfile = "3"
base64 = "0.22"

# TypeScript -> JavaScript transpilation (added in Phase 3).
# swc_fast_ts_strip is the same type-stripping engine Node uses for
# --experimental-strip-types: tiny, stable API, no full-pipeline churn.
swc_fast_ts_strip = { version = "23", optional = true }
swc_common = { version = "13", features = ["tty-emitter"], optional = true }

[features]
default = []
typescript = ["dep:swc_fast_ts_strip", "dep:swc_common"]

[profile.release]
opt-level = 3
